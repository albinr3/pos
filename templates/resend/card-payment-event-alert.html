<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{titleText}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:20px 24px;background:#18181b;color:#ffffff;">
              <p style="margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;">{{brandName}}</p>
              <h1 style="margin:8px 0 0;font-size:22px;line-height:1.3;">{{titleText}}</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:24px;">
              <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">
                {{introText}}
              </p>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:0 0 18px;">
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;color:#71717a;width:42%;">Cuenta</td>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;font-weight:600;">{{accountName}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;color:#71717a;">Monto</td>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;font-weight:600;">{{amountLabel}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;color:#71717a;">Estado</td>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;font-weight:600;">{{statusLabel}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;color:#71717a;">Fecha</td>
                  <td style="padding:10px 0;border-bottom:1px solid #e4e4e7;">{{createdAtLabel}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;color:#71717a;">ID de pago</td>
                  <td style="padding:10px 0;font-family:Consolas,Menlo,monospace;font-size:12px;">{{paymentId}}</td>
                </tr>
              </table>

              <a
                href="{{superAdminPaymentsUrl}}"
                style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;"
              >
                Ver pagos en super admin
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 24px;background:#fafafa;border-top:1px solid #e4e4e7;">
              <p style="margin:0 0 6px;font-size:12px;color:#71717a;">
                Notificación automática de {{brandName}}.
              </p>
              <p style="margin:0;font-size:12px;color:#71717a;">
                Soporte: <a href="mailto:{{supportEmail}}" style="color:#18181b;">{{supportEmail}}</a> · © {{year}}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
